name: Deploy Frontend

on:
  push:
    branches: ['dev/se-pay']
    paths:
      - 'client/**'
      - 'kubernetes/k3s/0-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    name: "Build & Deploy ITHust Frontend"
    runs-on: ubuntu-latest
    concurrency:
      group: k3s-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Required Secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          VITE_BASE_ENDPOINT: ${{ secrets.VITE_BASE_ENDPOINT }}
          VITE_CLIENT_ENDPOINT: ${{ secrets.VITE_CLIENT_ENDPOINT }}
        run: |
          missing=0
          for secret_name in DOCKERHUB_USERNAME DOCKERHUB_PASSWORD KUBECONFIG_B64 TELEGRAM_TO TELEGRAM_TOKEN VITE_BASE_ENDPOINT VITE_CLIENT_ENDPOINT; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$secret_name is required in Repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add missing values in GitHub: Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Create Environment Variables
        working-directory: client
        run: |
          echo "VITE_NODE_ENV=production" > .env.production
          echo "VITE_BASE_ENDPOINT=${{ secrets.VITE_BASE_ENDPOINT }}" >> .env.production
          echo "VITE_CLIENT_ENDPOINT=${{ secrets.VITE_CLIENT_ENDPOINT }}" >> .env.production
          echo "VITE_ELASTIC_APM_SERVER=${{ secrets.VITE_ELASTIC_APM_SERVER }}" >> .env.production
          echo "VITE_ELASTIC_APM_SERVER_TOKEN=${{ secrets.VITE_ELASTIC_APM_SERVER_TOKEN }}" >> .env.production

      - name: Install Dependencies
        working-directory: client
        run: npm ci

      - name: Build Docker Image
        working-directory: client
        env:
          IMAGE_NAME: minhkhoi779/ithust-frontend
          IMAGE_TAG: stable-${{ github.run_number }}
        run: |
          npm run build
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build -t "$IMAGE_NAME" .
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:stable"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:stable"

      - name: Deploy to K3s
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl apply -f kubernetes/k3s/0-frontend/
          kubectl rollout restart deployment/ithust-frontend -n production
          kubectl rollout status deployment/ithust-frontend -n production --timeout=180s

      - name: Send Telegram message on deploy success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deploy completed successfully (Client)
            👤 Actor: ${{ github.actor }}
            📝 Commit message: ${{ github.event.head_commit.message }}
            📂 Repository: ${{ github.repository }}
            🔗 See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      - name: Send Telegram message on deploy failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Deploy failed (Client)
            👤 Actor: ${{ github.actor }}
            📝 Commit message: ${{ github.event.head_commit.message }}
            📂 Repository: ${{ github.repository }}
            🔗 See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
