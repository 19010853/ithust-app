name: Deploy Frontend

on:
  push:
    branches: ['dev']
    paths:
      - 'client/**'

jobs:
  build-and-deploy:
    name: "Build & Deploy ITHust Frontend"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Environment Variables
        working-directory: client
        run: |
          echo "VITE_NODE_ENV=production" > .env.production
          echo "VITE_BASE_ENDPOINT=${{ secrets.VITE_BASE_ENDPOINT }}" >> .env.production
          echo "VITE_CLIENT_ENDPOINT=${{ secrets.VITE_CLIENT_ENDPOINT }}" >> .env.production
          echo "VITE_STRIPE_KEY=${{ secrets.STRIPE_API_KEY }}" >> .env.production
          echo "VITE_ELASTIC_APM_SERVER=${{ secrets.VITE_ELASTIC_APM_SERVER }}" >> .env.production
          echo "VITE_ELASTIC_APM_SERVER_TOKEN=${{ secrets.VITE_ELASTIC_APM_SERVER_TOKEN }}" >> .env.production

      - name: Install Dependencies
        working-directory: client
        run: npm install

      - name: Build Docker Image
        working-directory: client
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ithust-frontend
          IMAGE_TAG: stable-${{ github.run_number }}
        run: |
          npm run build
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build -t "$IMAGE_NAME" .
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:stable"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:stable"

      - name: Deploy to K3s (Restart Pod)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl delete pod -n production -l app=ithust-frontend --wait=false || true

      - name: Send Telegram message on deploy success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deploy completed successfully (Client)
            👤 Actor: ${{ github.actor }}
            📝 Commit message: ${{ github.event.head_commit.message }}
            📂 Repository: ${{ github.repository }}
            🔗 See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      - name: Send Telegram message on deploy failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Deploy failed (Client)
            👤 Actor: ${{ github.actor }}
            📝 Commit message: ${{ github.event.head_commit.message }}
            📂 Repository: ${{ github.repository }}
            🔗 See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
