# =============================================================================
# ITHust — Reusable workflow: Build & Deploy một backend service
# =============================================================================
# Được gọi bởi các workflow cụ thể của từng service (deploy-*.yml)
# Inputs:
#   service_name  : tên Kubernetes label, vd: ithust-gateway
#   service_label : tên hiển thị, vd: "ITHust Gateway"
#   image_name    : full Docker Hub image, vd: minhkhoi779/ithust-gateway
#   service_dir   : thư mục chứa source, vd: server/1-gateway-service
#   k8s_dir       : thư mục Kubernetes manifest, vd: kubernetes/k3s/1-gateway-service
# =============================================================================

name: "[Reusable] Deploy Backend Service"

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_label:
        required: true
        type: string
      image_name:
        required: true
        type: string
      service_dir:
        required: true
        type: string
      k8s_dir:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_PASSWORD:
        required: false
      NPM_TOKEN:
        required: false
      KUBECONFIG_B64:
        required: false
      TELEGRAM_TO:
        required: false
      TELEGRAM_TOKEN:
        required: false

jobs:
  build-and-deploy:
    name: "Build & Deploy ${{ inputs.service_label }}"
    runs-on: ubuntu-latest
    concurrency:
      group: k3s-production-${{ inputs.service_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Required Secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          missing=0
          for secret_name in DOCKERHUB_USERNAME DOCKERHUB_PASSWORD NPM_TOKEN KUBECONFIG_B64 TELEGRAM_TO TELEGRAM_TOKEN; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$secret_name is required in Repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add missing values in GitHub: Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Install Dependencies
        working-directory: ${{ inputs.service_dir }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cleanup_npmrc() {
            rm -f .npmrc
          }
          trap cleanup_npmrc EXIT
          printf '@19010853:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm view @19010853/ithust-shared@0.0.18 version --registry=https://npm.pkg.github.com
          npm ci --legacy-peer-deps

      - name: Build Docker Image
        working-directory: ${{ inputs.service_dir }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: stable-${{ github.run_number }}
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build --build-arg NPM_TOKEN="$NPM_TOKEN" -t "$IMAGE_NAME" .
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:stable"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:stable"

      - name: Deploy to K3s
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl apply -f ${{ inputs.k8s_dir }}/
          kubectl rollout restart deployment/${{ inputs.service_name }} -n production
          kubectl rollout status deployment/${{ inputs.service_name }} -n production --timeout=180s

      - name: Collect K3s diagnostics on failure
        if: failure()
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get deploy,pods,events -n production
          kubectl describe deployment/${{ inputs.service_name }} -n production
          kubectl logs -n production -l app=${{ inputs.service_name }} --tail=80 || true

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Deploy completed successfully (${{ inputs.service_label }})
            👤 Actor: ${{ github.actor }}
            📝 Commit message: ${{ github.event.head_commit.message }}
            📂 Repository: ${{ github.repository }}
            🔗 See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Deploy failed (${{ inputs.service_label }})
            👤 Actor: ${{ github.actor }}
            📝 Commit message: ${{ github.event.head_commit.message }}
            📂 Repository: ${{ github.repository }}
            🔗 See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
