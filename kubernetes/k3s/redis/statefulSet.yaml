apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ithust-redis
  namespace: production
spec:
  serviceName: ithust-redis
  # k3s single-node setup: 1 replica (master only). Scale to 3+ for HA if needed.
  replicas: 1
  selector:
    matchLabels:
      app: ithust-redis
  template:
    metadata:
      labels:
        app: ithust-redis
    spec:
      initContainers:
        - name: config
          image: redis:alpine
          command: ["sh", "-c"]
          args:
            - |
              cp /tmp/redis/redis.conf /etc/redis/redis.conf

              echo "finding master..."
              MASTER_FQDN=`hostname  -f | sed -e 's/ithust-redis-[0-9]\./ithust-redis-0./'`
              if [ "$(redis-cli -h sentinel -p 5000 ping)" != "PONG" ]; then
                echo "master not found, defaulting to ithust-redis-0"

                if [ "$(hostname)" == "ithust-redis-0" ]; then
                  echo "this is ithust-redis-0, not updating config..."
                else
                  echo "updating redis.conf..."
                  echo "slaveof $MASTER_FQDN 6379" >> /etc/redis/redis.conf
                fi
              else
                echo "sentinel found, finding master"
                MASTER="$(redis-cli -h sentinel -p 5000 sentinel get-master-addr-by-name mymaster | grep -E '(^ithust-redis-\d{1,})|([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})')"
                echo "master found : $MASTER, updating redis.conf"
                echo "slaveof $MASTER 6379" >> /etc/redis/redis.conf
              fi
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis/
            - name: config
              mountPath: /tmp/redis/
      containers:
        - name: ithust-redis
          image: redis:alpine
          command: ["redis-server"]
          args: ["/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
              name: ithust-redis
          readinessProbe:
            periodSeconds: 10
            tcpSocket:
              port: ithust-redis
          livenessProbe:
            periodSeconds: 10
            tcpSocket:
              port: ithust-redis
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/
      volumes:
        - name: redis-config
          emptyDir: {}
        - name: config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 500Mi
