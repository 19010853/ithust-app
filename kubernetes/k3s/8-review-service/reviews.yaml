apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithust-review
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithust-review
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ithust-review
    spec:
      containers:
        - name: ithust-review
          image: minhkhoi779/ithust-review:stable
          imagePullPolicy: Always
          resources:
            limits:
              memory: "512Mi"
              cpu: "0.5"
            requests:
              cpu: 100m
              memory: 120Mi
          ports:
            - name: review
              containerPort: 4007
          env:
            - name: ENABLE_APM
              value: "1"
            - name: NODE_ENV
              value: "production"
            - name: CLUSTER_TYPE
              value: "k3s"
            - name: GATEWAY_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: gateway-jwt-token
            - name: JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: jwt-token
            - name: RABBITMQ_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-rabbitmq-endpoint
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-postgres-host
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-postgres-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-postgres-password
            - name: DATABASE_NAME
              value: "ithust_reviews"
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-name
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-key
            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-secret
            - name: API_GATEWAY_URL
              value: "http://ithust-gateway.production.svc.cluster.local:4000"
            - name: ELASTIC_SEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elasticsearch-url
            - name: ELASTIC_APM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-server-url
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-secret-token
