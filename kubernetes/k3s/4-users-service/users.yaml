apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithust-users
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithust-users
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ithust-users
    spec:
      containers:
        - name: ithust-users
          image: minhkhoi779/ithust-users:stable
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "300m"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 120Mi
          ports:
            - name: users
              containerPort: 4003
          env:
            - name: ENABLE_APM
              value: "0"
            - name: NODE_ENV
              value: "production"
            - name: GATEWAY_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: gateway-jwt-token
            - name: JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: jwt-token
            - name: RABBITMQ_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-rabbitmq-endpoint
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: mongo-database-url
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-name
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-key
            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-secret
            - name: API_GATEWAY_URL
              value: "http://ithust-gateway.production.svc.cluster.local:4000"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-redis-host
            - name: ELASTIC_SEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elasticsearch-url
            - name: ELASTIC_APM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-server-url
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-secret-token
            - name: PLATFORM_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: platform-owner-email
