# Mẫu - KHÔNG apply file này trực tiếp.
# Sao chép thành: kubernetes/k3s/secrets/backend-secrets.yaml
# và thay mọi giá trị bằng chuỗi base64 hợp lệ (không dùng chữ "<base64>").
#
# Encode PowerShell:
#   [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-secret"))
apiVersion: v1
kind: Secret
metadata:
  name: ithust-backend-secret
  namespace: production
type: Opaque
data:
  secret-key-one: "<base64>"
  secret-key-two: "<base64>"
  gateway-jwt-token: "<base64>"
  jwt-token: "<base64>"
  ithust-redis-host: "<base64>"  # redis://:password@host:6379
  sender-email: "<base64>"  # From address shown in notification emails
  sender-email-password: "<base64>"  # legacy SMTP password fallback
  brevo-smtp-username: "<base64>"  # Brevo SMTP login email address
  brevo-smtp-key: "<base64>"  # Brevo SMTP key, not REST API key
  platform-owner-email: "<base64>"
  platform-owner-username: "<base64>"
  platform-owner-password: "<base64>"
  ithust-mysql-db: "<base64>"   # mysql://user:password@host:3307/dbname
  ithust-postgres-host: "<base64>"  # ithust-postgres.production.svc.cluster.local
  ithust-postgres-user: "<base64>"
  ithust-postgres-password: "<base64>"
  cloud-name: "<base64>"
  cloud-api-key: "<base64>"
  cloud-api-secret: "<base64>"
  mongo-database-url: "<base64>"  # mongodb://ithust-mongo.production.svc.cluster.local:27017/ithust
  stripe-secret-key: "<base64>"  # Stripe test secret key, sk_test_...
  stripe-order-webhook-secret: "<base64>"  # Stripe webhook signing secret, whsec_...
  stripe-connect-webhook-secret: "<base64>"  # Stripe Connect webhook signing secret, whsec_...
  ithust-rabbitmq-user: "<base64>"
  ithust-rabbitmq-password: "<base64>"
  ithust-rabbitmq-endpoint: "<base64>"  # amqp://user:password@ithust-queue.production.svc.cluster.local:5672
  ithust-elasticsearch-url: "<base64>"  # http://elastic:<password>@ithust-elastic.production.svc.cluster.local:9200
  ithust-elastic-apm-server-url: ""  # để trống nếu không dùng self-hosted APM
  ithust-elastic-apm-secret-token: ""
  ithust-elasticsearch-host: "<base64>"
  ithust-elasticsearch-username: "<base64>"
  ithust-elasticsearch-password: "<base64>"
  usd-to-vnd-rate-api-url: "<base64>"
  usd-to-vnd-rate-fallback: "<base64>"
