apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithust-frontend
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithust-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ithust-frontend
    spec:
      containers:
        - name: ithust-frontend
          image: minhkhoi779/ithust-frontend:stable
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "300m"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 120Mi
          ports:
            - name: frontend
              containerPort: 80
