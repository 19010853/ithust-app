apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithust-order
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithust-order
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ithust-order
    spec:
      containers:
        - name: ithust-order
          image: minhkhoi779/ithust-order:stable
          imagePullPolicy: Always
          resources:
            limits:
              memory: "512Mi"
              cpu: "300m"
            requests:
              cpu: 100m
              memory: 120Mi
          ports:
            - name: order
              containerPort: 4006
          env:
            - name: ENABLE_APM
              value: "0"
            - name: NODE_ENV
              value: "production"
            - name: GATEWAY_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: gateway-jwt-token
            - name: JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: jwt-token
            - name: RABBITMQ_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-rabbitmq-endpoint
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: mongo-database-url
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-name
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-key
            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-secret
            - name: API_GATEWAY_URL
              value: "http://ithust-gateway.production.svc.cluster.local:4000"
            - name: CLIENT_URL
              value: "https://ithust.shop"
            - name: ELASTIC_SEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elasticsearch-url
            - name: PLATFORM_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: platform-owner-email
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: stripe-order-webhook-secret
            - name: STRIPE_CURRENCY
              value: "usd"
            - name: STRIPE_VND_PER_UNIT
              value: "25000"
            - name: DISPUTE_SELLER_RESPONSE_HOURS
              value: "48"
            - name: ELASTIC_APM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-server-url
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-secret-token
