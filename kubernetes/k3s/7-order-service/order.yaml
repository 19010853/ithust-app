apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithust-order
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithust-order
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ithust-order
    spec:
      containers:
        - name: ithust-order
          image: minhkhoi779/ithust-order:stable
          imagePullPolicy: Always
          resources:
            limits:
              memory: "512Mi"
              cpu: "0.5"
            requests:
              cpu: 100m
              memory: 120Mi
          ports:
            - name: order
              containerPort: 4006
          env:
            - name: ENABLE_APM
              value: "0"
            - name: NODE_ENV
              value: "production"
            - name: GATEWAY_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: gateway-jwt-token
            - name: JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: jwt-token
            - name: RABBITMQ_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-rabbitmq-endpoint
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: mongo-database-url
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-name
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-key
            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: cloud-api-secret
            - name: API_GATEWAY_URL
              value: "http://ithust-gateway.production.svc.cluster.local:4000"
            - name: CLIENT_URL
              value: "https://ithust.shop"
            - name: ELASTIC_SEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elasticsearch-url
            - name: PLATFORM_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: platform-owner-email
            - name: PLATFORM_BANK_ID
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: sepay-platform-bank-id
            - name: PLATFORM_BANK_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: sepay-platform-bank-account
            - name: SEPAY_MODE
              value: "live"
            - name: USD_TO_VND_RATE_API_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: usd-to-vnd-rate-api-url
            - name: USD_TO_VND_RATE_FALLBACK
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: usd-to-vnd-rate-fallback
            - name: ELASTIC_APM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-server-url
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-secret-token
