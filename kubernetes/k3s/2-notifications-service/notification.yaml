apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithust-notification
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithust-notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ithust-notification
    spec:
      containers:
        - name: ithust-notification
          image: minhkhoi779/ithust-notification:stable
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "300m"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 120Mi
          ports:
            - name: notification
              containerPort: 4001
          env:
            - name: ENABLE_APM
              value: "0"
            - name: NODE_ENV
              value: "production"
            - name: CLIENT_URL
              value: "https://ithust.shop"
            - name: RABBITMQ_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-rabbitmq-endpoint
            - name: SMTP_HOST
              value: "smtp-relay.brevo.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: brevo-smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: brevo-smtp-key
            - name: SENDER_NAME
              value: "ITHust App"
            - name: SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: sender-email
            - name: SENDER_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: sender-email-password
            - name: ELASTIC_SEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elasticsearch-url
            - name: ELASTIC_APM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-server-url
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ithust-backend-secret
                  key: ithust-elastic-apm-secret-token
