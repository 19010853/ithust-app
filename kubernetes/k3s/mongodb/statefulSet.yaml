apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ithust-mongo
  namespace: production
spec:
  selector:
    matchLabels:
      app: ithust-mongo
  serviceName: ithust-mongo
  replicas: 1
  template:
    metadata:
      labels:
        app: ithust-mongo
    spec:
      containers:
        - name: ithust-mongo
          image: mongo:latest
          ports:
            - containerPort: 27017
              name: ithust-mongo
          volumeMounts:
            - name: mongo-local-storage
              mountPath: /data/db
      volumes:
        - name: mongo-local-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
