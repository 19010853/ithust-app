# Copy file này thành backend-secrets.yaml và điền giá trị thật.
# Giá trị trong data phải là base64. Encode bằng PowerShell:
#   [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-secret"))
apiVersion: v1
kind: Secret
metadata:
  name: ithust-backend-secret
  namespace: production
type: Opaque
data:
  secret-key-one: "<base64>"
  secret-key-two: "<base64>"
  gateway-jwt-token: "<base64>"
  jwt-token: "<base64>"
  ithust-redis-host: "<base64>"  # redis://:password@host:6379
  sender-email: "<base64>"
  sender-email-password: "<base64>"
  ithust-mysql-db: "<base64>"   # mysql://user:password@host:3307/dbname
  ithust-postgres-host: "<base64>"
  ithust-postgres-user: "<base64>"
  ithust-postgres-password: "<base64>"
  cloud-name: "<base64>"
  cloud-api-key: "<base64>"
  cloud-api-secret: "<base64>"
  mongo-database-url: "<base64>"  # mongodb://host:27017/dbname
  stripe-api-key: "<base64>"
  stripe-client-key: "<base64>"
  ithust-rabbitmq-user: "<base64>"
  ithust-rabbitmq-password: "<base64>"
  ithust-rabbitmq-endpoint: "<base64>"  # amqp://user:password@host:5672
  ithust-elasticsearch-url: "<base64>"  # http://user:password@host:9200
  ithust-elastic-apm-server-url: ""
  ithust-elastic-apm-secret-token: ""
  ithust-elasticsearch-host: "<base64>"
  ithust-elasticsearch-username: "<base64>"
  ithust-elasticsearch-password: "<base64>"
