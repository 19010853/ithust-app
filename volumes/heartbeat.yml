heartbeat.config.monitors:
  path: ${path.config}/monitors.d/*.yml
  reload.enabled: false
  reload.period: 5s

heartbeat.monitors:
  - type: http
    id: ithust-api-gateway
    name: ithust API Gateway Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4000/gateway-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-notification
    name: ithust Notification Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4001/notification-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-auth
    name: ithust Auth Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4002/auth-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-users
    name: ithust Users Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4003/user-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-gigs
    name: ithust Gigs Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4004/gig-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-chat
    name: ithust Chat Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4005/chat-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-orders
    name: ithust Orders Service
    schedule: "@every 5s"
    hosts: ["http://192.168.1.23:4006/order-health"]
    check.request.method: GET
    check.response.status: [200]

  - type: http
    id: ithust-reviews
    name: ithust Reviews Service
    schedule: "@every 5s"
    urls: ["http://192.168.1.23:4007/review-health"]
    check.request.method: GET
    check.response.status: [200]

processors:
  - add_cloud_metadata: ~
  - add_docker_metadata: ~

monitoring.enabled: true

output.elasticsearch:
  hosts: ["http://elasticsearch_container:9200"]
  username: "elastic"
  password: "admin1234"
